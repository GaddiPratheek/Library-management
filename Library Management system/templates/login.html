<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Library Management System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="d-inline-flex p-3 rounded-circle bg-white text-primary mb-3 shadow-sm">
        <i class="bi bi-book-half fs-2"></i>
      </div>
      <h3 class="fw-bold mb-1">Library Management</h3>
      <p class="text-white-50 small mb-0">Sign in to access your library portal</p>
    </div>

    <div class="auth-body">
      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show small py-2 mb-3" role="alert">
              {{ message }}
              <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('login') }}" method="POST">
        <div class="mb-3">
          <label for="username" class="form-label">Username or Email</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="e.g. admin or rahul" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center">
            <label for="password" class="form-label">Password</label>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control border-start-0 border-end-0" id="password" name="password" placeholder="Enter password" required>
            <button class="btn btn-outline-secondary border-start-0" type="button" id="togglePassword">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fs-6 mb-3">
          <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
        </button>

        <div class="text-center small text-muted mb-3">
          Don't have an account? <a href="{{ url_for('register') }}" class="text-primary fw-semibold text-decoration-none">Register here</a>
        </div>
      </form>

      <!-- Demo Credentials Helper Accordion/Card -->
      <div class="card bg-light border-0 rounded-3 mt-3">
        <div class="card-body p-3">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <span class="fw-bold text-dark small"><i class="bi bi-key-fill text-warning me-1"></i> Quick Demo Logins:</span>
          </div>
          <div class="row g-2">
            <div class="col-6">
              <button class="btn btn-outline-primary btn-sm w-100 text-truncate fill-cred-btn" data-user="admin" data-pw="admin123" title="Click to fill Admin credentials">
                <i class="bi bi-shield-lock me-1"></i> Admin
              </button>
            </div>
            <div class="col-6">
              <button class="btn btn-outline-secondary btn-sm w-100 text-truncate fill-cred-btn" data-user="rahul" data-pw="student123" title="Click to fill Student credentials">
                <i class="bi bi-mortarboard me-1"></i> Student
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Toggle password visibility
  const toggleBtn = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');
  if (toggleBtn && passwordInput) {
    toggleBtn.addEventListener('click', function() {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      this.querySelector('i').classList.toggle('bi-eye');
      this.querySelector('i').classList.toggle('bi-eye-slash');
    });
  }

  // Quick fill credentials for seamless testing
  document.querySelectorAll('.fill-cred-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.getElementById('username').value = this.getAttribute('data-user');
      document.getElementById('password').value = this.getAttribute('data-pw');
    });
  });
</script>
</body>
</html>
